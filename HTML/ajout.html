<!DOCTYPE html>
<html lang="fr">
   <head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Ajouter une tache</title>
     <link rel="stylesheet" href="../CSS/AJ.css">
   </head>
   <body>
   <!--
       BUG CORRIGÉ : action="db.php" pointait vers HTML/db.php (inexistant).
       Ton JS appelle partout "../PHP/...", donc db.php doit être dans PHP/.
   -->
   <form action="../PHP/db.php" method="POST" id="formTache">
     <table border="1">
        <tr>
         <th colspan="6">NOUVELLE TACHE</th>
        </tr>
        <tr>
            <th>TITRE</th>
            <th>DESCRIPTION</th>
            <th>GRANDEUR DE PRIORITE</th>
            <th>DATE</th>
            <th>DUREE(en jour)</th>
            <th>ETAT</th>
        </tr>
        <tr>
            <td>
                <input type="text" id="titre" name="titre" placeholder="Nouveau titre">
            </td>
            <td>
                <textarea id="des" name="des" rows="2" cols="30" placeholder="Description détaillé de la tache"></textarea>
            </td>
            <td>
                <select id="priorite" name="priorite">
                    <option value="">Veuillez choisir une Grandeur de priorité pour cette tache</option>
                    <option>Faible importance</option>
                    <option>priorité moyenne</option>
                    <option>Primordiale</option>
                    <option>Capitale</option>
                </select>
            </td>
            <td>
                <input type="date" id="date" name="date">
            </td>
            <td>
                <input type="number" min="1" step="1" id="jour" name="jour" placeholder="Durée en jour">
            </td>
            <td>
                <select id="etat" name="etat">
                    <option>COMMENCE</option>
                    <option>EN COURS</option>
                    <option>TERMINER</option>
                </select>
             </td>
         </tr>
        </table>
      <br>
       <div style="text-align: center;">
         <button type="button" onclick="validerNouvelleTache(event)">VALIDER</button>
         <a href="Slowrush.html"><button type="button">ANNULER</button></a>
         <button type="reset">REINITIALISER</button>
        </div>
     </form>
     <script src="../JS/aj.js"></script>
   </body>
</html>
